<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 4 - Solicitud Laboral</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main>
        <header>
            <h1>Únete a nuestro equipo</h1>
            <p>Completa el formulario para postularte a nuestras vacantes activas</p>
        </header>

        <form action="#" method="POST" enctype="multipart/form-data">
            <!-- DATOS PERSONALES -->
            <section>
                <h2>Datos Personales</h2>
                <div class="grupo-inputs">
                    <div class="campo">
                        <label for="nombre">Nombre completo *</label>
                        <input type="text" id="nombre" name="nombre" placeholder="Ej. Juan Pérez" required>
                    </div>

                    <div class="campo">
                        <label for="email">Correo electrónico *</label>
                        <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required>
                    </div>

                    <div class="campo">
                        <label for="telefono">Teléfono de contacto *</label>
                        <input type="tel" id="telefono" name="telefono" placeholder="+57 300 123 4567" required>
                    </div>
                </div>
            </section>

            <!-- PUESTO AL QUE POSTULA -->
            <section>
                <h2>Puesto de Interés</h2>
                <div class="campo">
                    <label for="puesto">Selecciona una vacante *</label>
                    <select id="puesto" name="puesto" required>
                        <option value="" disabled selected>Selecciona una opción...</option>
                        <option value="frontend">Desarrollador Frontend (Full-Time)</option>
                        <option value="backend">Desarrollador Backend (Full-Time)</option>
                        <option value="fullstack">Desarrollador Full Stack</option>
                        <option value="ui_ux">Diseñador UI / UX</option>
                        <option value="qa">Ingeniero de QA / Testing</option>
                    </select>
                </div>
            </section>

            <!-- CARGA DE ARCHIVO (CV) -->
            <section>
                <h2>Área de Carga de Archivos</h2>
                <div class="campo">
                    <label>Sube tu Currículum (CV) *</label>
                    <div class="zona-archivo">
                        <input type="file" id="cv" name="cv" accept=".pdf,.doc,.docx" required>
                        <div class="contenido-zona">
                            <span class="icono-nube">☁️</span>
                            <p class="texto-principal"><strong>Arrastra y suelta tu archivo aquí</strong></p>
                            <p class="texto-secundario">o busca en tu dispositivo (Formatos: PDF, Word. Máx. 10MB)</p>
                            <span class="btn-buscar">Seleccionar archivo</span>
                        </div>
                    </div>
                </div>
            </section>

            <!-- ENLACES OPCIONALES -->
            <section>
                <h2>Enlaces Opcionales</h2>
                <div class="grupo-inputs dos-columnas">
                    <div class="campo">
                        <label for="portafolio">Portafolio / Sitio Web</label>
                        <input type="url" id="portafolio" name="portafolio" placeholder="https://tuportafolio.com">
                    </div>

                    <div class="campo">
                        <label for="linkedin">Perfil de LinkedIn</label>
                        <input type="url" id="linkedin" name="linkedin" placeholder="https://linkedin.com/in/usuario">
                    </div>
                </div>
            </section>

            <button type="submit" class="boton-enviar">Enviar postulación</button>
        </form>
    </main>
</body>
</html>
